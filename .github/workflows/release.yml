name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # A tag makes electron-builder try its own publisher unless explicitly disabled.
      # action-gh-release below publishes with the scoped GITHUB_TOKEN instead.
      - run: npm run dist -- --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/QuotaOrb-Setup-*.exe
          generate_release_notes: true
